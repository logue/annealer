[package]
name = "annealer"
version = "0.1.0"
edition = "2024"
description = "Reorders HTML/Vue attributes by semantic meaning using swappable YAML profiles."
license = "MIT"
repository = "https://github.com/logue/annealer"
homepage = "https://github.com/logue/annealer"
authors = ["Logue <logue@hotmail.co.jp>"]
keywords = ["html", "vue", "formatter", "attributes", "css"]
categories = ["development-tools"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["cli"]
cli = ["dep:clap"]
# JavaScript bindings for the npm package (`wasm-pack build --features wasm`).
wasm = ["dep:wasm-bindgen"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
malva = { version = "0.16", features = ["config_serde"] }
# Keep in lockstep with the raffia version malva depends on (malva 0.16 → raffia 0.12).
# The vendor-prefix pass re-parses malva's output, so both must use the same
# parser and AST; a mismatch would also bundle two raffia copies and break
# sharing `malva::Syntax`. Upgrade together with malva, not before.
raffia = { version = "0.12", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wasm-bindgen = { version = "0.2", optional = true }
yaml_serde = "0.10"

[[bin]]
name = "anyl"
path = "src/bin/anyl.rs"
required-features = ["cli"]

[dev-dependencies]
jsonschema = "0.58"
