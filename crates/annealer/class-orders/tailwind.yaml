  - match: ["-inset-be-*", "-inset-be-full", "-inset-be-px", "inset-be-*", "inset-be-auto", "inset-be-full", "inset-be-px"]
    properties: ["inset-block-end"]
  - match: ["-inset-bs-*", "-inset-bs-full", "-inset-bs-px", "inset-bs-*", "inset-bs-auto", "inset-bs-full", "inset-bs-px"]
    properties: ["inset-block-start"]
  - match: ["-inset-*", "-inset-full", "-inset-px", "inset-*", "inset-auto", "inset-full", "inset-px"]
    properties: ["inset"]
  - match: ["-inset-s-*", "-inset-s-full", "-inset-s-px", "-start-full", "-start-px", "inset-s-*", "inset-s-auto", "inset-s-full", "inset-s-px", "start-auto", "start-full", "start-px"]
