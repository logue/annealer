<!doctype html>
<html lang="en">
  <head>
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <meta charset="utf-8" />
    <link href="/styles.css" rel="stylesheet" />
    <title>Example</title>
    <style>
      body {
        color: #222;
        margin: 0;
        font-family: system-ui, sans-serif;
        display: flex;
      }
    </style>
  </head>
  <body>
    <nav aria-label="Main" class="nav" id="nav">
      <a href="/" class="nav__home" title="Home">Home</a>
      <a href="/docs" class="nav__link" aria-current="page">Docs</a>
    </nav>
    <main id="main">
      <h1 class="title">Welcome</h1>
      <form method="post" action="/subscribe" class="form" id="subscribe">
        <label for="email">Email</label>
        <input
          required
          placeholder="you@example.com"
          name="email"
          type="email"
          id="email"
          class="form__input"
          aria-describedby="email-help"
        />
        <small id="email-help" class="form__help">We never share it.</small>
        <button
          data-track="subscribe"
          type="submit"
          class="btn btn--primary"
          onclick="track()"
        >
          Subscribe
        </button>
      </form>
      <picture>
        <source type="image/webp" srcset="/hero.webp" />
        <img
          height="300"
          width="600"
          alt="Hero"
          src="/hero.jpg"
          loading="lazy"
          class="hero"
        />
      </picture>
      <svg
        viewBox="0 0 24 24"
        class="icon"
        aria-hidden="true"
        width="24"
        height="24"
      >
        <path d="M0 0h24v24H0z" fill="none" />
      </svg>
      <!-- annealer-disable-next-line: third-party embed -->
      <iframe
        title="Map"
        src="https://example.com/map"
        width="600"
        height="400"
        loading="lazy"
      ></iframe>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
